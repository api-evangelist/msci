description: >-
  MSCI is a leading provider of critical decision support tools and services for
  the global investment community, publishing indexes, ESG and climate ratings,
  risk analytics, and real estate and private asset data. The MSCI Developer
  Community at developer.msci.com catalogs thirty-plus REST APIs spanning index
  performance and constituents, ESG data and reports, sustainability and
  climate on-demand data, risk and instrument analytics, portfolio optimization,
  real estate performance, and private capital metrics, alongside an official
  Python SDK and the MSCI Connector, a Model Context Protocol server listed in
  the Claude connector directory.
